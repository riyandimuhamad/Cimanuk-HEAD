<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cimanuk-HEAD | Hydro-Environmental Analytics Dashboard</title>
    <!-- Favicon standar KemenPU atau Dashboard -->
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Logo_PU_%28Kementerian_Pekerjaan_Umum_dan_Perumahan_Rakyat%29.png/220px-Logo_PU_%28Kementerian_Pekerjaan_Umum_dan_Perumahan_Rakyat%29.png" type="image/x-icon">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%;
            height: 100%; 
            overflow: hidden; 
            background-color: #0e1117; 
        }
        iframe { 
            position: absolute;
            top: -2px;
            left: -2px;
            width: calc(100vw + 4px); 
            height: calc(100vh + 54px); /* Meng-crop 2px atas dan ~52px footer bawah */
            border: none; 
            margin: 0;
            padding: 0;
            display: block;
        }
    </style>
</head>
<body>
    <!-- Membalikan embed=true agar tidak diblokir, tapi footernya di-crop pakai CSS atas -->
    <iframe src="https://cimanuk-head.streamlit.app/?embed=true"></iframe>
</body>
</html>
